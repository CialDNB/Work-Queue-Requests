name: Deploy production

# Manual, button-triggered PRODUCTION deploy — the execution half of the
# docs/GO-LIVE.md launch (the `npm run deploy` + smoke-check steps), run inside
# GitHub Actions where the app's scoped CLOUDFLARE_API_TOKEN lives. Mirrors the
# deploy-staging job in ci.yml, and the same pattern docshub uses.
#
# Why CI, not a laptop: the deploy authenticates with the account-scoped API
# token (a repo secret) instead of whatever Cloudflare account a laptop's
# `wrangler login` happens to hold, and every prod ship is auditable in the
# Actions log. (Actions secrets are write-only — a laptop can't read them, so a
# local deploy can't share this token anyway.)
#
# GO-LIVE discipline is preserved — production stays MANUAL:
#   • only a human clicking "Run workflow" (or `gh workflow run deploy-prod.yml`)
#     ever triggers it; it never runs on push/merge,
#   • only from `main`, and only when DEPLOY_ENABLED is "true" (any case, as in ci.yml),
#   • and it re-verifies the tree before shipping.
# To enforce the docs/GO-LIVE.md owner sign-off on EVERY run, add the go-live
# owner as a REQUIRED REVIEWER on the `production` environment (repo Settings →
# Environments → production); GitHub then blocks each deploy until they approve.
# First-time launch runs provision + db:apply via the "Provision production" workflow
# (provision-production.yml) or by hand (see GO-LIVE.md) — this button is the recurring
# deploy step.

on:
  workflow_dispatch: {}

# Checkout only — this repo's deploy cuts no release/tag.
permissions:
  contents: read

# One production deploy at a time; never cancel an in-flight one mid-ship.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deployment-target:
    # Production ships CIAL apps only. A DB Israel app is promoted by the central pipeline, so
    # scripts/deployment-target.mjs refuses it here, and on an invalid deployment marker or a sign
    # of a DB Israel app with no marker. It reads two refs: the one this run was dispatched from,
    # and the default branch, checked out into a directory of its own, so a branch that deleted
    # the marker cannot turn the CIAL path back on. `deploy` needs this job, so on a refusal it
    # never starts and never reaches the production environment. It installs nothing (the reader
    # uses Node built-ins only), and neither checkout keeps a token. See docs/DECISIONS.md
    # 2026-10-27.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .default-branch
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Refuse unless this ref is a CIAL app
        run: node scripts/deployment-target.mjs --require cial
      - name: Refuse unless the default branch is a CIAL app
        run: node scripts/deployment-target.mjs --require cial --root .default-branch

  deploy:
    needs: [deployment-target]
    runs-on: ubuntu-latest
    # Surfaces in the Environments view + deployment history, and is the hook
    # for the go-live owner as a required-reviewer approval gate (see header).
    environment:
      name: production
      url: https://work-queue-requests.cialdnb.ai
    steps:
      - name: Guard — main only, deploys enabled
        # Values via env, not ${{ }} interpolation into the script (avoids the
        # run-step injection class actionlint flags).
        # DEPLOY_ENABLED is evaluated by the SAME expression ci.yml's staging deploy uses
        # (`vars.DEPLOY_ENABLED == 'true'`), not compared in bash: GitHub's `==` ignores
        # case, bash's `!=` does not, so a var set to "TRUE" used to pass staging and
        # block production. One evaluator, one answer.
        # SCOPE, deliberately: this job runs under `environment: production`, so a
        # DEPLOY_ENABLED variable on the production ENVIRONMENT wins over the repo variable
        # here (ci.yml's staging job has no environment and reads only the repo one). That
        # makes an environment-level DEPLOY_ENABLED=false a prod-only kill switch. Intended —
        # DECISIONS 2026-10-12.
        env:
          REF: ${{ github.ref }}
          DEPLOY_ENABLED_IS_TRUE: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Production ships from main only (got '$REF'). Merge to main first."
            exit 1
          fi
          if [ "$DEPLOY_ENABLED_IS_TRUE" != "true" ]; then
            echo "::error::DEPLOY_ENABLED is not 'true' — wire the app (CLOUDFLARE_API_TOKEN + the DEPLOY_ENABLED repo var) and complete docs/GO-LIVE.md before shipping production."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the gitleaks pass below
      - name: Preflight — refuse to ship unprovisioned config (AICOE-453)
        # Fail in seconds, not minutes: an unprovisioned fork otherwise burns the full
        # npm ci + re-verify and dies late at the Cloudflare API with an opaque auth
        # error (the first migration probe even swallows its failure). wrangler.jsonc
        # only — staging placeholders are irrelevant to a prod ship. Deliberately NOT
        # verify:bootstrap, which excludes the placeholder check by design (DECISIONS
        # 2026-06-17: it would false-positive once an app provisions real ids).
        # `grep -n`, not `-q`: identical exit status on every path (0 match / 1 no-match / 2
        # missing file), so the guard's decision is unchanged — but the offending line is printed
        # into the Actions log. That matters because the sentinel can also be sitting in a JSONC
        # COMMENT, which grep cannot distinguish from live config: then every real binding IS
        # provisioned, re-running provision changes nothing, and without the line number the
        # operator has no way to see why (DECISIONS 2026-08-04). `verify:edge` fails such a
        # comment on every PR, so it should never reach here.
        run: |
          if grep -n PLACEHOLDER_RUN_PROVISION wrangler.jsonc; then
            echo "::error::wrangler.jsonc still carries PLACEHOLDER_RUN_PROVISION (line above). If it is a real binding id, run 'npm run provision'. If it is inside a comment, delete the id from that comment — provision cannot clear it."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the tree before shipping (the FULL local gate set)
        # main only takes green-CI'd PRs, but re-verify the exact tree before a
        # production ship — the one place worth the belt-and-suspenders. `npm run ci`
        # is everything the PR gate ran locally: typecheck ×3, lint, web build,
        # coverage floors, hook + platform-script tests, and every verify:* guard —
        # not the typecheck+lint+plain-test subset this step used to run (AICOE-453).
        run: npm run ci
      - name: Secrets scan (gitleaks, checksum-verified)
        # ci.yml runs this as its own job; a prod ship re-runs it on the exact tree.
        run: |
          ver=8.21.2
          file="gitleaks_${ver}_linux_x64.tar.gz"
          sha=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/${file}" -o "$file"
          echo "${sha}  ${file}" | sha256sum -c -
          tar -xzf "$file" gitleaks
          ./gitleaks git --no-banner --redact .
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Semgrep fence (pinned, matches ci.yml)
        # semgrep 1.97 (via opentelemetry-instrumentation) imports pkg_resources, which
        # Python 3.12 runners don't ship and setuptools >=81 no longer provides — pin <81.
        run: |
          pip install semgrep==1.97.0 'setuptools<81'
          semgrep scan --config semgrep/ --error --metrics=off
      # Every kit migration has a copy in this app's migrations folder (matched by content,
      # any number) before any migration is applied or the Worker ships. `npm run ci` above
      # runs it only once package.json has the verify:kit-migrations script (a manual fork
      # step), so it runs here on its own, as in ci.yml. See DECISIONS 2026-09-25.
      - name: Kit migrations present (content-matched)
        run: node scripts/check-kit-migrations.mjs
      # Migrations run BEFORE the new Worker ships, so the schema is in place for the
      # code that needs it. D1 uses the scoped token already here — no extra setup.
      # See the staging twin in ci.yml. Production is where a mis-pointed database_id does
      # unrecoverable damage, so this runs before any DDL.
      - name: D1 ownership preflight (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-d1-identity.mjs --env production
      - name: Check + apply D1 migrations (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 migrations list DB --remote || true
          npm run db:migrate
      # Inert unless an app added a PRODUCTION Supabase instance + the SUPABASE_DB_URL repo
      # secret (the by-exception Postgres path); skips cleanly otherwise. Prod and staging
      # are SEPARATE Supabase projects (SUPABASE_DB_URL vs SUPABASE_DB_URL_STAGING) — same
      # isolation as the two D1 databases. See migrations/supabase/.
      - name: Apply Supabase migrations (only when SUPABASE_DB_URL is set)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run db:migrate:supabase
      - name: Deploy to production
        # The same `npm run deploy` (build:web + wrangler deploy) run at launch,
        # so there's one source of truth for the prod deploy sequence.
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke check /_health
        # Reuses the same script + contract as the staging deploy; ok|degraded
        # pass, unhealthy/unreachable fails the run so a bad ship is loud.
        run: bash scripts/smoke-health.sh "https://work-queue-requests.cialdnb.ai/_health"
