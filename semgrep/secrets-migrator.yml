# AICOE-472 secrets migrator — a security fence for the throwaway migration Worker under
# tools/secrets-migrator/. That worker reads EXTRACT-class secret VALUES in-isolate via a Secrets
# Store binding's `.get()`. The cron tail passes console + exception text verbatim, so a value that
# reaches `console.*` or a thrown/`Error` would leak into logs. This rule fences the direct forms:
# a value flowing from a `.get()` into a console call or a throw, within one function, fails CI.
# It is a tripwire, not a proof — see "WHAT THIS RULE DOES NOT CATCH" below before relying on it.
#
# Scoped to tools/secrets-migrator only (the rest of the kit legitimately logs `.get()` results,
# e.g. env.MARKER.get / KV reads). CODEOWNERS-gated (semgrep/) — expects code-owner review.
#
# `javascript` in `languages` is load-bearing, not tidy — same reason as semgrep/kit-rules.yml.
# Semgrep selects targets by EXTENSION: `[typescript]` alone matches .ts/.tsx and nothing else, so a
# .js/.mjs/.cjs added to this worker would be scanned by no rule here and the fence would silently
# stop applying. Verified against the CI-pinned semgrep 1.97.0 with a three-flow probe — the source
# inside the sink (`console.log(await env.SECRETS.get('X'))`), the value logged through a local, and
# the value thrown through a local. In a .js file that probe drew 0 findings under `[typescript]`
# and 3 under `[typescript, javascript]`; a byte-identical .ts twin drew 3 either way. Taint
# tracking is not weaker on JavaScript — both propagating flows resolve on .js/.mjs/.cjs exactly as
# on .ts — so target selection was the only thing the missing word changed.
#
# NOTE: nothing enforces this mechanically. Semgrep never fails a rule for matching zero files, and
# `npm run ci` does not run semgrep at all — only .github/workflows/ci.yml does. #212 swept
# kit-rules.yml by hand and missed THIS file for a release. If you add a rule anywhere under
# semgrep/, declare both languages yourself. See docs/DECISIONS.md for what a real guard needs.
#
# WHAT THIS RULE DOES NOT CATCH — bounds, measured on the same version, so nobody mistakes it for
# total coverage. It is a tripwire for the obvious mistake, not a proof of no leak:
#   - Interprocedural flow. Semgrep OSS taint is intraprocedural: pass the value to a helper and
#     let the helper log or throw it and nothing fires. `migrate.ts` already hands the value to
#     `cf.swapToSecretText()`, so this shape exists in the worker today.
#   - Indirect sinks. `console['error'](v)`, `const { error } = console`, and `const log =
#     console.log` all escape `console.$METHOD(...)`. kit-rules.yml closes these forms explicitly
#     for DB and EMAIL; this rule does not yet.
#   - tools/secrets-migrator/test/**. Semgrep's built-in .semgrepignore drops `test/` at any depth
#     (the repo ships no .semgrepignore of its own), so the worker's own tests are unscanned.
#   - .mts / .cts anywhere. semgrep 1.97.0 maps `javascript` to .js/.jsx/.mjs/.cjs and `typescript`
#     to .ts/.tsx — neither covers .mts/.cts, so NO `languages:` value can reach them. The kit has
#     no such file today and nothing stops one appearing. See docs/DECISIONS.md.
rules:
  - id: no-store-secret-value-in-logs-or-errors
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >
      A value read from a binding's `.get()` (a Secrets Store secret in this worker) must never
      flow into `console.*` or a thrown value — the cron tail records console/exception text
      verbatim. Keep logs and errors value-free: record NAMES and generic reason codes only
      (see classifyError / the run marker).
    pattern-sources:
      - pattern-either:
          - pattern: await $B.get(...)
          - pattern: $B.get(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: console.$METHOD(...)
              - pattern: throw $ERR
    paths:
      include:
        - tools/secrets-migrator
